# CONFIGURACIÓN DE DECAP CMS — CONECTA PANA
# Antes de publicar, reemplaza los valores TU-USUARIO, TU-REPOSITORIO y TU-WORKER.
backend:
  name: github
  repo: conectapana26/conectapana26.github.io
  branch: main
  base_url: https://TU-WORKER.workers.dev
  auth_endpoint: auth

site_url: https://conectapana26.github.io
display_url: https://conectapana26.github.io
locale: es
publish_mode: simple
media_folder: "img/uploads"
public_folder: "img/uploads"

collections:
  - name: "contenido-principal"
    label: "Noticias y novedades"
    files:
      - name: "publicaciones"
        label: "Publicaciones de la página principal"
        file: "noticias.json"
        fields:
          - label: "Publicaciones"
            name: "publicaciones"
            widget: "list"
            label_singular: "Publicación"
            summary: "{{fields.title}} · {{fields.category}}"
            add_to_top: true
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - label: "Categoría"
                name: "category"
                widget: "select"
                options:
                  - { label: "Noticias", value: "noticias" }
                  - { label: "Eventos", value: "eventos" }
                  - { label: "Actividades", value: "actividades" }
                  - { label: "Comunicados", value: "comunicados" }
              - { label: "Etiqueta corta", name: "label", widget: "string", hint: "Ejemplo: Institucional, Evento o Circular." }
              - { label: "Fecha visible", name: "date", widget: "string", required: false, hint: "Ejemplo: 18 de octubre de 2026." }
              - { label: "Resumen de la tarjeta", name: "summary", widget: "text" }
              - { label: "Información completa para Leer más", name: "content", widget: "text", hint: "Escribe aquí todos los detalles. Puedes separar párrafos con una línea en blanco." }
              - { label: "Imagen", name: "image", widget: "image", required: false, hint: "Las imágenes que subas se guardarán en img/uploads." }
